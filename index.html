<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D2CBox API</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    pre code.hljs { background: transparent; padding: 0; }
  </style>
</head>
<body class="h-screen flex flex-col bg-[#0d1117] text-gray-300 text-sm antialiased overflow-hidden">

  <!-- Top bar -->
  <header class="h-11 shrink-0 flex items-center gap-3 px-4 bg-[#010409] border-b border-white/10">
    <button id="menu" class="md:hidden text-gray-400 hover:text-white" aria-label="Toggle menu">☰</button>
    <span class="font-semibold text-white">D2CBox <span class="text-sky-400">API</span></span>
  </header>

  <div class="flex flex-1 min-h-0 relative">

    <!-- Features (left) -->
    <aside id="sidebar" class="hidden md:flex absolute md:static inset-y-0 left-0 z-20 w-60 shrink-0 flex-col bg-[#161b22] border-r border-white/10">
      <div class="px-4 py-2 text-[11px] font-semibold tracking-wider text-gray-500 uppercase">Features</div>
      <nav id="features" class="flex-1 overflow-y-auto pb-4"></nav>
    </aside>

    <!-- Code (right) -->
    <main class="flex-1 min-w-0 flex flex-col">
      <nav id="tabs" class="h-10 shrink-0 flex items-end overflow-x-auto bg-[#010409] border-b border-white/10"></nav>

      <div class="min-h-9 shrink-0 flex items-center justify-between gap-3 px-4 py-1.5 border-b border-white/5">
        <div id="hint" class="text-xs text-gray-400"></div>
        <button id="copy" class="shrink-0 px-3 py-1 rounded bg-sky-500/15 text-sky-300 hover:bg-sky-500/25 text-xs font-medium">Copy</button>
      </div>

      <div id="editor" class="flex-1 overflow-auto font-mono text-[13px] leading-6"></div>
    </main>
  </div>

  <script>
    /**
     * Add a new feature:
     * 1. Create snippets/<name>.txt with sections:  /* ===== Tab Name | Where to paste ===== *\/
     * 2. Add one line below.
     */
    const FEATURES = [
      { title: 'Shiprocket EDD', file: 'snippets/shiprocket-edd.txt' }
    ];

    const $ = (id) => document.getElementById(id);
    const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');

    let data = [];
    let current = { fi: 0, ti: 0 };

    // Split one feature file into tabs
    const parse = (text) => {
      const parts = text.split(/^\/\* =+ (.+?) =+ \*\/[ \t]*$/m);
      const tabs = [];
      for (let i = 1; i < parts.length; i += 2) {
        const [name, hint = ''] = parts[i].split('|').map(s => s.trim());
        tabs.push({ name, hint, code: parts[i + 1].replace(/^\n+|\s+$/g, '') });
      }
      return tabs;
    };

    const render = () => {
      const feature = data[current.fi];
      const tab = feature.tabs[current.ti];

      // Left: feature names
      $('features').innerHTML = data.map((f, i) => `
        <button data-feature="${i}" class="w-full px-4 py-2 text-left ${i === current.fi ? 'bg-sky-500/15 text-white border-l-2 border-sky-400' : 'text-gray-400 border-l-2 border-transparent hover:bg-white/5 hover:text-gray-200'}">
          ${f.title}
        </button>
      `).join('');

      // Top: tabs
      $('tabs').innerHTML = feature.tabs.map((t, i) => `
        <button data-tab="${i}" class="h-full shrink-0 px-5 border-r border-white/10 whitespace-nowrap ${i === current.ti ? 'bg-[#0d1117] text-white border-t-2 border-t-sky-400' : 'text-gray-500 hover:text-gray-300'}">
          ${t.name}
        </button>
      `).join('');

      // Hint + code
      $('hint').textContent = tab.hint;
      const html = hljs.highlightAuto(tab.code, ['xml', 'json', 'javascript']).value;
      const lines = tab.code.split('\n').length;

      $('editor').innerHTML = `
        <div class="flex min-w-max py-3">
          <pre class="sticky left-0 shrink-0 px-4 text-right text-gray-600 bg-[#0d1117] select-none">${Array.from({ length: lines }, (_, i) => i + 1).join('\n')}</pre>
          <pre class="pr-8"><code class="hljs">${html}</code></pre>
        </div>`;
      $('editor').scrollTop = 0;

      history.replaceState(null, '', `#${slug(feature.title)}/${slug(tab.name)}`);
    };

    const closeSidebar = () => {
      if (innerWidth >= 768) return;
      $('sidebar').classList.add('hidden');
      $('sidebar').classList.remove('flex');
    };

    // Events
    $('features').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-feature]');
      if (!btn) return;
      current = { fi: Number(btn.dataset.feature), ti: 0 };
      render();
      closeSidebar();
    });

    $('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      current.ti = Number(btn.dataset.tab);
      render();
    });

    $('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(data[current.fi].tabs[current.ti].code);
      $('copy').textContent = 'Copied';
      setTimeout(() => ($('copy').textContent = 'Copy'), 1500);
    });

    $('menu').addEventListener('click', () => {
      $('sidebar').classList.toggle('hidden');
      $('sidebar').classList.toggle('flex');
    });

    // Init
    (async () => {
      data = await Promise.all(FEATURES.map(async (f) => ({
        ...f,
        tabs: parse(await (await fetch(f.file)).text())
      })));

      const [hashFeature, hashTab] = location.hash.slice(1).split('/');
      const fi = Math.max(0, data.findIndex(f => slug(f.title) === hashFeature));
      const ti = Math.max(0, data[fi].tabs.findIndex(t => slug(t.name) === hashTab));
      current = { fi, ti };
      render();
    })();
  </script>
</body>
</html>
